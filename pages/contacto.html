  <script>
  // MENSAJE DE LLAMADA
  function showCallMessage() {
    const msg = document.getElementById("callMessage");
    msg.classList.add("show");
    setTimeout(() => msg.classList.remove("show"), 3500);
  }

  // CLICK EN TELÉFONO
  function onPhoneClick() {
    showCallMessage();
    setTimeout(() => {
      window.location.href = "tel:+573044973053";
    }, 1200);
  }

  // CLICK EN EMAIL → IR A CONTACTO & ENVÍO EN INDEX

</script>

<div id="callMessage" class="call-alert">
  <span class="sound-wave">🔊</span>
  <span class="sound-wave">🔊</span>
  <span class="sound-wave">🔊</span>
  <br>

 <div id="callMessage" class="call-alert">
  🔊 La llamada está sonando… Por favor espera.
</div>


<script>
  const phoneBox = document.getElementById("phoneBox");
  const callMsg = document.getElementById("callMessage");

  phoneBox.addEventListener("click", function(e) {
    e.preventDefault(); // Evita que abra app de llamadas

    callMsg.style.display = "block";

    // Sonido/onda animada (tres vibraciones)
    callMsg.innerHTML = "🔊 La llamada está sonando…";

    let count = 0;
    const interval = setInterval(() => {
      callMsg.innerHTML = "🔊".repeat(count + 1) + " Llamando…";
      count++;

      if (count === 3) clearInterval(interval);
    }, 500);

    // Ocultar después de 3 segundos
    setTimeout(() => {
      callMsg.style.display = "none";
    }, 3000);
  });
</script>

</body>
